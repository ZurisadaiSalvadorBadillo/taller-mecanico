spring.application.name=taller-auth
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/taller_mecanico?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.frontend.origin=http://localhost:5174
app.storage.client-photos-dir=uploads/clientes
app.storage.workshop-photos-dir=uploads/talleres
