spring.application.name=taller-auth
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/taller_mecanico?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-this-secret-to-a-long-random-value-of-at-least-32-chars
app.jwt.expiration-minutes=60
app.frontend.origin=http://localhost:5173
